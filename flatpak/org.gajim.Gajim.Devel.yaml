app-id: org.gajim.Gajim.Devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gajim
tags:
  - devel
  - development
  - nightly
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.mpris.MediaPlayer2.*
  # Automatic status
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.Mutter.IdleMonitor
  # Keyring
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # tray/status icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # GnuPG
  - --filesystem=~/.gnupg
  - --filesystem=xdg-run/gnupg
  # gpu acceleration
  - --device=dri
  # extensions
  - --env=PYTHONPATH=/app/plugins/site-packages
  - --env=GI_TYPELIB_PATH=/app/lib/girepository-1.0:/app/plugins/lib/girepository-1.0

add-extensions:
  org.gajim.Gajim.Devel.Plugin:
    directory: plugins
    merge-dirs: lib;site-packages
    add-ld-path: lib
    subdirectories: true
    no-autodownload: true
    autodelete: true

build-options:
  env:
    PIP_PREFIX: /app
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - /share/man
  - '*.a'
  - '*.la'

modules:

  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dvapi=false
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.10.tar.xz
        sha256: 56e3f01a3a18b575beea4c34349f99cdaba316e1f7c271b1231f7bcf5d9af73b

  - name: farstream
    rm-configure: true
    sources:
      - type: archive
        url: https://freedesktop.org/software/farstream/releases/farstream/farstream-0.2.9.tar.gz
        sha256: cb7d112433cf7c2e37a8ec918fb24f0ea5cb293cfa1002488e431de26482f47b
      - type: patch
        path: farstream-make-4.3.patch

  - python3-modules.json

  - name: python3-omemo-dr
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation .
    sources:
      - type: git
        url: https://dev.gajim.org/gajim/omemo-dr.git

  - name: python3-nbxmpp
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation .
    sources:
      - type: git
        url: https://dev.gajim.org/gajim/python-nbxmpp.git

  - name: gajim
    buildsystem: simple
    build-commands:
      - ./make.py build --dist=flatpak-nightly
      - ./make.py install --dist=flatpak-nightly --prefix=/app
      - pip3 install --no-build-isolation .
      - cp -t ${FLATPAK_DEST} app-overrides.json
    sources:
      - type: git
        url: https://dev.gajim.org/gajim/gajim.git
      - type: file
        path: app-overrides.json
      - type: shell
        commands:
          - mv gajim/data/icons/hicolor/scalable/apps/gajim{-devel,}.svg
    post-install:
      - install -d /app/plugins
