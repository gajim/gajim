repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        exclude: ".githooks/"
      - id: ruff-format
      - id: ruff-check
        args: [--select, I, --fix]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
    - id: codespell
      pass_filenames: false
      additional_dependencies:
        - tomli

  - repo: https://github.com/fsfe/reuse-tool
    rev: v5.0.2
    hooks:
      - id: reuse
        stages: [manual]
