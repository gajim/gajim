name: Windows Nightly Build

on:
  workflow_dispatch:

env:
  PIP_BREAK_SYSTEM_PACKAGES: '1'

jobs:
  msys2:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { sys: ucrt64,  env: ucrt-x86_64 }

    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup msys2 environment
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{matrix.sys}}
          install: >-
            git
            curl

      - name: Install dependencies
        run: |
          ./win/build.sh build

      - name: Build Installer
        run: |
          ./win/build.sh create-installer

      - name: Upload
        run: |
          curl -T dist/Gajim-Installer.exe --ssl-reqd \
          ftp://${{ secrets.ftp_user }}:${{ secrets.ftp_password }}@${{ secrets.ftp_server }}/./downloads/snap/win/Test-Gajim-Nightly-${{ matrix.arch }}-${{ steps.date.outputs.date }}.exe"

      - name: Upload Portable
        run: |
          curl -T dist/Gajim-Portable-Installer.exe --ssl-reqd \
          ftp://${{ secrets.ftp_user }}:${{ secrets.ftp_password }}@${{ secrets.ftp_server }}/./downloads/snap/win/Test-Gajim-Portable-Nightly-${{ matrix.arch }}-${{ steps.date.outputs.date }}.exe"
