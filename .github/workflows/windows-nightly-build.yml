name: Windows Nightly Build

on:
  workflow_dispatch:

env:
  PIP_BREAK_SYSTEM_PACKAGES: '1'

jobs:
  msys2:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { sys: ucrt64,  env: ucrt-x86_64 }

    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup msys2 environment
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{matrix.sys}}
          install: >-
            git
            curl

      - name: Install dependencies
        run: |
          ./platform/win/build.sh setup

      - name: Build Installer
        run: |
          ./platform/win/build.sh build-installer

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload
        run: |
          curl -T dist/Gajim-Installer.exe --ssl-reqd "ftp://${{ secrets.ftp_user }}:${{ secrets.ftp_password }}@${{ secrets.ftp_server }}/./downloads/snap/win/Test-Gajim-${{ steps.date.outputs.date }}.exe"

      - name: Upload Portable
        run: |
          curl -T dist/Gajim-Portable-Installer.exe --ssl-reqd "ftp://${{ secrets.ftp_user }}:${{ secrets.ftp_password }}@${{ secrets.ftp_server }}/./downloads/snap/win/Test-Gajim-${{ steps.date.outputs.date }}-Portable.exe"

      - name: Upload MSIX
        run: |
          curl -T dist/Gajim.msixbundle --ssl-reqd "ftp://${{ secrets.ftp_user }}:${{ secrets.ftp_password }}@${{ secrets.ftp_server }}/./downloads/snap/win/Test-Gajim-${{ steps.date.outputs.date }}.msixbundle"
